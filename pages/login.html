<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentHub - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card shadow-lg p-4">
    <div class="text-center mb-3">
      <i class="bi bi-mortarboard-fill text-primary" style="font-size:3rem"></i>
      <h3 class="fw-bold mb-0">StudentHub</h3>
      <small class="text-muted">Student Database &amp; Academic Management</small>
    </div>

    <div id="loginBox">
      <div id="loginError" class="alert alert-danger d-none py-2"></div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input id="username" class="form-control" required placeholder="admin or roll number">
          <div class="invalid-feedback">Username is required</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input id="password" type="password" class="form-control" required>
            <button type="button" id="togglePwd" class="btn btn-outline-secondary"><i class="bi bi-eye"></i></button>
            <div class="invalid-feedback">Password is required</div>
          </div>
        </div>
        <button id="loginBtn" class="btn btn-brand w-100">Login</button>
      </form>
      <p class="text-center mt-3 mb-0 small">Student? <a href="#" id="showRegister">Register with your roll number</a></p>
    </div>

    <div id="registerBox" class="d-none">
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Roll Number</label>
          <input id="regRoll" class="form-control" required minlength="3">
          <div class="form-text">Admin must have added you as a student first.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="regPassword" type="password" class="form-control" required minlength="6">
          <div class="invalid-feedback">Min 6 characters</div>
        </div>
        <button class="btn btn-brand w-100">Create Account</button>
      </form>
      <p class="text-center mt-3 mb-0 small"><a href="#" id="showLogin">Back to login</a></p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
