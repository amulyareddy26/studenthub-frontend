<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentHub - Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <div class="content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h4 class="fw-bold mb-0">Reports</h4>
        <div class="d-flex gap-2 no-print">
          <button class="btn btn-brand" onclick="exportCsv()"><i class="bi bi-download"></i> Export Students CSV</button>
          <button class="btn btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
        </div>
      </div>
      <div class="card p-3">
        <h6 class="fw-bold">Department-wise Summary</h6>
        <div class="table-responsive"><table class="table align-middle mb-0">
          <thead><tr><th>Code</th><th>Department</th><th>Students</th></tr></thead>
          <tbody id="rows"></tbody>
          <tfoot><tr class="fw-bold"><td colspan="2">Total</td><td id="totalCount">0</td></tr></tfoot>
        </table></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../components/layout.js"></script>
<script src="../js/reports.js"></script>
</body>
</html>
