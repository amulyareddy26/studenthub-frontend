<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentHub - Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <div class="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Users / Roles</h4>
        <button class="btn btn-brand" onclick="openUser()"><i class="bi bi-plus-lg"></i> Add User</button>
      </div>
      <div class="alert alert-info py-2 small">For STUDENT users, the username must be the student's roll number.</div>
      <div class="card p-3"><div class="table-responsive"><table class="table align-middle mb-0">
        <thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody></table></div></div>
    </div>
  </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="userTitle">Add User</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <form id="userForm" novalidate>
      <input type="hidden" id="userId">
      <div class="mb-3"><label class="form-label">Username</label><input id="uName" class="form-control" required minlength="3" maxlength="50"><div class="invalid-feedback">3-50 characters</div></div>
      <div class="mb-3"><label class="form-label">Password <small class="text-muted" id="pwdHint"></small></label><input id="uPassword" type="password" class="form-control" minlength="6" maxlength="100"><div class="invalid-feedback">Min 6 characters</div></div>
      <div class="row g-3">
        <div class="col-6"><label class="form-label">Role</label><select id="uRole" class="form-select"><option>ADMIN</option><option>FACULTY</option><option>STUDENT</option></select></div>
        <div class="col-6"><label class="form-label">Status</label><select id="uStatus" class="form-select"><option>ACTIVE</option><option>INACTIVE</option></select></div>
      </div>
    </form>
  </div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand" onclick="saveUser()">Save</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../components/layout.js"></script>
<script src="../js/users.js"></script>
</body>
</html>
