<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentHub - Student Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <div class="content">
      <h4 class="fw-bold mb-3" id="formTitle">Add Student</h4>
      <form id="studentForm" novalidate>
        <div class="card p-4 mb-3">
          <h6 class="fw-bold mb-3">Personal Details</h6>
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Roll Number *</label>
              <input id="rollNo" class="form-control" required maxlength="30"><div class="invalid-feedback">Roll number is required</div></div>
            <div class="col-md-5"><label class="form-label">Full Name *</label>
              <input id="name" class="form-control" required pattern="[A-Za-z][A-Za-z .'\-]{1,99}"><div class="invalid-feedback">Enter a valid name (letters only)</div></div>
            <div class="col-md-3"><label class="form-label">Gender *</label>
              <select id="gender" class="form-select" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
              <div class="invalid-feedback">Select gender</div></div>
          </div>
        </div>
        <div class="card p-4 mb-3">
          <h6 class="fw-bold mb-3">Contact</h6>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Email *</label>
              <input id="email" type="email" class="form-control" required><div class="invalid-feedback">Enter a valid email</div></div>
            <div class="col-md-6"><label class="form-label">Phone *</label>
              <input id="phone" class="form-control" required pattern="[0-9]{10}" maxlength="10"><div class="invalid-feedback">Phone must be 10 digits</div></div>
          </div>
        </div>
        <div class="card p-4 mb-3">
          <h6 class="fw-bold mb-3">Academic Details</h6>
          <div class="row g-3">
            <div class="col-md-8"><label class="form-label">Department *</label>
              <select id="departmentId" class="form-select" required><option value="">Select department</option></select>
              <div class="invalid-feedback">Select a department</div></div>
            <div class="col-md-4"><label class="form-label">Year *</label>
              <select id="year" class="form-select" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
              <div class="invalid-feedback">Select year</div></div>
          </div>
        </div>
        <button id="saveBtn" class="btn btn-brand"><i class="bi bi-check-lg"></i> Save</button>
        <a href="students.html" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../components/layout.js"></script>
<script src="../js/student-form.js"></script>
</body>
</html>
