<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentHub - Departments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <div class="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Departments</h4>
        <button id="addBtn" class="btn btn-brand" onclick="openDep()"><i class="bi bi-plus-lg"></i> Add Department</button>
      </div>
      <div class="card p-3"><div class="table-responsive"><table class="table align-middle mb-0">
        <thead><tr><th>Code</th><th>Name</th><th>Students</th><th id="actHead">Actions</th></tr></thead>
        <tbody id="rows"></tbody></table></div></div>
    </div>
  </div>
</div>

<div class="modal fade" id="depModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="depTitle">Add Department</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <form id="depForm" novalidate>
      <input type="hidden" id="depId">
      <div class="mb-3"><label class="form-label">Code</label><input id="depCode" class="form-control" required maxlength="20" pattern="[A-Za-z0-9]+"><div class="invalid-feedback">Letters/numbers only</div></div>
      <div class="mb-3"><label class="form-label">Name</label><input id="depName" class="form-control" required maxlength="100"><div class="invalid-feedback">Name is required</div></div>
    </form>
  </div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand" onclick="saveDep()">Save</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../components/layout.js"></script>
<script src="../js/departments.js"></script>
</body>
</html>
