<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentHub - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <div class="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Dashboard</h4>
        <a id="addBtn" href="student-form.html" class="btn btn-brand"><i class="bi bi-plus-lg"></i> Add Student</a>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-12 col-md-4"><div class="card kpi p-3"><div class="d-flex align-items-center gap-3"><div class="icon bg-primary-subtle text-primary"><i class="bi bi-people"></i></div><div><div class="text-muted small">Students</div><h3 class="mb-0" id="kStudents">-</h3></div></div></div></div>
        <div class="col-12 col-md-4"><div class="card kpi p-3"><div class="d-flex align-items-center gap-3"><div class="icon bg-success-subtle text-success"><i class="bi bi-building"></i></div><div><div class="text-muted small">Departments</div><h3 class="mb-0" id="kDepartments">-</h3></div></div></div></div>
        <div class="col-12 col-md-4"><div class="card kpi p-3"><div class="d-flex align-items-center gap-3"><div class="icon bg-warning-subtle text-warning"><i class="bi bi-person-gear"></i></div><div><div class="text-muted small">Users</div><h3 class="mb-0" id="kUsers">-</h3></div></div></div></div>
      </div>
      <div class="row g-3">
        <div class="col-12 col-lg-6"><div class="card p-3"><h6 class="fw-bold">Students by Department</h6><canvas id="deptChart" height="200"></canvas></div></div>
        <div class="col-12 col-lg-6"><div class="card p-3"><h6 class="fw-bold">Recent Students</h6>
          <div class="table-responsive"><table class="table table-sm align-middle mb-0">
            <thead><tr><th>Roll No</th><th>Name</th><th>Dept</th><th>Year</th></tr></thead>
            <tbody id="recentRows"></tbody></table></div></div></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../components/layout.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
