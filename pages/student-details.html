<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentHub - Student Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <div class="content">
      <div id="profile"></div>
      <div class="row g-3 mt-1">
        <div class="col-md-4"><div class="card p-3 h-100"><h6 class="fw-bold">Contact</h6><div id="contact"></div></div></div>
        <div class="col-md-4"><div class="card p-3 h-100"><h6 class="fw-bold">Academic</h6><div id="academic"></div></div></div>
        <div class="col-md-4"><div class="card p-3 h-100"><h6 class="fw-bold">Record History</h6><div id="history"></div></div></div>
      </div>
      <div class="card p-3 mt-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold mb-0">Semester Records <small class="text-muted ms-2" id="recSummary"></small></h6>
          <button id="recAddBtn" class="btn btn-brand btn-sm" onclick="openRecord()"><i class="bi bi-plus-lg"></i> Add Record</button>
        </div>
        <div class="table-responsive"><table class="table align-middle mb-0">
          <thead><tr><th>Semester</th><th>CGPA</th><th>Attendance %</th><th>Remarks</th><th id="recActHead"></th></tr></thead>
          <tbody id="recRows"></tbody></table></div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="recordModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="recTitle">Add Academic Record</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <form id="recordForm" novalidate>
      <input type="hidden" id="recordId">
      <div class="row g-3">
        <div class="col-6"><label class="form-label">Semester (1-8)</label><input id="semester" type="number" min="1" max="8" class="form-control" required><div class="invalid-feedback">1 to 8</div></div>
        <div class="col-6"><label class="form-label">CGPA (0-10)</label><input id="cgpa" type="number" step="0.01" min="0" max="10" class="form-control" required><div class="invalid-feedback">0 to 10</div></div>
        <div class="col-12"><label class="form-label">Attendance % (0-100)</label><input id="attendance" type="number" step="0.1" min="0" max="100" class="form-control" required><div class="invalid-feedback">0 to 100</div></div>
        <div class="col-12"><label class="form-label">Remarks</label><textarea id="remarks" class="form-control" maxlength="255" rows="2"></textarea></div>
      </div>
    </form>
  </div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand" onclick="saveRecord()">Save</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../components/layout.js"></script>
<script src="../js/student-details.js"></script>
</body>
</html>
